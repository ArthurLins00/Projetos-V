appId: com.projetosv.fiscalize
---
# O bundle já foi gerado no passo "Sobe o Metro", então o primeiro launch leva menos de 1 min no emulador.
# Duas tentativas de 90 s: se o Maestro não enxergar o app, o run-maestro.sh reinicia o emulador logo, em vez de
# esperar 3 × 3 min (que custava 18 min quando o emulador travava antes e depois do reboot).
- retry:
    maxRetries: 1
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible:
            id: "login-email"
          timeout: 90000
- stopApp
