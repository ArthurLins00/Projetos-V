name: Docker

# Valida o ambiente do Docker (compose.yaml e Dockerfiles) do jeito que o guia docs/COMO_RODAR_COM_DOCKER.md manda usar:
# constrói as imagens, sobe PostgreSQL, Redis e backend, confere o /health, o seed (login dos usuários de teste) e
# roda os E2E do Playwright contra os containers. O agente de IA é construído e iniciado com uma chave falsa só
# para confirmar que o serviço sobe. Por fim, testa a restauração (Atividade 5 de Segurança): faz o backup com
# scripts/backup.sh, simula a perda do banco e das fotos, restaura com scripts/restore.sh e confere que os dados
# voltaram. Roda quando algo que entra nas imagens muda, na regressão diária e sob demanda.
on:
  pull_request:
    branches: [main, dev]
    paths:
      - compose.yaml
      - .env.example
      - backend/**
      - ai-agent/**
      - e2e/**
      - playwright.config.ts
      - scripts/**
      - .github/workflows/docker.yml
  push:
    branches: [main, dev]
    paths:
      - compose.yaml
      - .env.example
      - backend/**
      - ai-agent/**
      - e2e/**
      - playwright.config.ts
      - scripts/**
      - .github/workflows/docker.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    name: Docker Compose (stack completa)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JWT_SECRET: docker-ci-secret
      AI_AGENT_SECRET: docker-ci-agent-secret
      E2E_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Versões
        run: |
          docker --version
          docker compose version

      - name: Constrói as imagens (backend e agente de IA)
        run: docker compose --profile ai build

      # --wait só termina quando postgres, redis e backend estão healthy (o backend aplica migrações e seed na subida)
      - name: Sobe PostgreSQL, Redis e backend
        run: docker compose up -d --wait --wait-timeout 240

      - name: Confere o health check
        run: |
          curl -fsS "$E2E_API_URL/health" | tee health.json
          echo
          jq -e '.status == "ok" and .database == "connected" and .redis == "connected"' health.json

      - name: Confere o seed (login dos usuários de teste)
        run: |
          for user in 'cidadao@fiscalize.gov.br:Cidadao@123456' 'gestor@fiscalize.gov.br:Gestor@123456' 'admin@fiscalize.gov.br:Admin@123456'; do
            email=${user%%:*}; senha=${user#*:}
            curl -fsS -X POST "$E2E_API_URL/auth/login" -H 'Content-Type: application/json' \
              -d "{\"email\":\"$email\",\"senha\":\"$senha\"}" | jq -e '.token | length > 0' > /dev/null
            echo "login ok: $email"
          done

      - name: Agente de IA sobe na rede interna
        env:
          GEMINI_API_KEY: chave-falsa-so-para-subir
        run: |
          docker compose --profile ai up -d ai-agent
          for i in $(seq 1 30); do
            if docker compose logs ai-agent | grep -q 'Assistente Fiscalize'; then
              docker compose logs ai-agent
              # A porta 3333 não é publicada no host: chama de dentro do container do backend, pela rede do compose
              docker compose exec -T backend node -e "fetch('http://ai-agent:3333/chat',{method:'POST'}).then(r=>{console.log('ai-agent respondeu', r.status);process.exit(r.status<500?0:1)}).catch(e=>{console.error(e);process.exit(1)})"
              exit 0
            fi
            sleep 2
          done
          docker compose logs ai-agent
          echo "::error::O agente de IA não subiu"
          exit 1

      - name: E2E (Playwright) contra os containers
        env:
          CI: true
        run: |
          npm ci
          npm run test:e2e

      # Teste de restauração: os E2E acima deixaram usuários, chamados e fotos no banco e no volume
      - name: Backup, perda simulada e restauração
        env:
          BACKUP_PASSPHRASE: senha-do-teste-de-restauracao
          BACKUP_DIR: ${{ runner.temp }}/backups
        run: |
          sql() {
            docker compose exec -T postgres sh -c 'psql -tA -F"|" -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
          }
          snapshot() {
            sql <<'SQL' | tr -d '[:space:]'
          SELECT (SELECT count(*) FROM usuario), (SELECT count(*) FROM chamado),
                 (SELECT count(*) FROM chamado_foto), (SELECT count(*) FROM timeline_event);
          SQL
            echo -n "|"
            docker compose exec -T backend sh -c 'find /app/uploads -type f | wc -l' | tr -d '[:space:]'
          }

          antes=$(snapshot)
          echo "Antes do backup (usuários|chamados|fotos|eventos|arquivos): $antes"
          [ "$(echo "$antes" | cut -d'|' -f3)" -gt 0 ] || { echo "::error::Os E2E não deixaram fotos para testar a restauração"; exit 1; }

          inicio=$(date +%s)
          bash scripts/backup.sh
          ls -l "$BACKUP_DIR"
          ls "$BACKUP_DIR"/*.gpg > /dev/null

          echo "Simulando a perda: apaga o schema do banco e as fotos"
          echo 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;' | sql > /dev/null
          docker compose exec -T backend sh -c 'find /app/uploads -mindepth 1 -delete'
          if curl -fsS -X POST "$E2E_API_URL/auth/login" -H 'Content-Type: application/json' \
               -d '{"email":"cidadao@fiscalize.gov.br","senha":"Cidadao@123456"}' > /dev/null; then
            echo "::error::O login ainda funciona depois de apagar o banco; a perda não foi simulada"; exit 1
          fi

          # Uma cópia adulterada tem que ser recusada antes de tocar no banco
          cp -r "$BACKUP_DIR" "$RUNNER_TEMP/adulterada"
          echo x >> "$(ls "$RUNNER_TEMP"/adulterada/*-db.sql.gz.gpg)"
          if bash scripts/restore.sh --yes latest "$RUNNER_TEMP/adulterada"; then
            echo "::error::A restauração aceitou uma cópia com soma SHA-256 errada"; exit 1
          fi

          bash scripts/restore.sh --yes latest
          duracao=$(( $(date +%s) - inicio ))

          depois=$(snapshot)
          echo "Depois da restauração: $depois"
          [ "$antes" = "$depois" ] || { echo "::error::Os dados restaurados não batem com os de antes ($antes → $depois)"; exit 1; }

          curl -fsS "$E2E_API_URL/health" | jq -e '.status == "ok"' > /dev/null
          curl -fsS -X POST "$E2E_API_URL/auth/login" -H 'Content-Type: application/json' \
            -d '{"email":"cidadao@fiscalize.gov.br","senha":"Cidadao@123456"}' | jq -e '.token | length > 0' > /dev/null
          foto=$(echo 'SELECT url FROM chamado_foto LIMIT 1;' | sql | tr -d '[:space:]')
          curl -fsS -o /dev/null "$E2E_API_URL$foto"

          IFS='|' read -r usuarios chamados fotos eventos arquivos <<< "$depois"
          {
            echo "### 💾 Teste de restauração"
            echo
            echo "| | Antes | Depois da restauração |"
            echo "|---|---|---|"
            echo "| Usuários | $(echo "$antes" | cut -d'|' -f1) | $usuarios |"
            echo "| Chamados | $(echo "$antes" | cut -d'|' -f2) | $chamados |"
            echo "| Fotos no banco | $(echo "$antes" | cut -d'|' -f3) | $fotos |"
            echo "| Eventos da linha do tempo | $(echo "$antes" | cut -d'|' -f4) | $eventos |"
            echo "| Arquivos de foto | $(echo "$antes" | cut -d'|' -f5) | $arquivos |"
            echo
            echo "Backup cifrado (AES-256) → banco e fotos apagados → cópia adulterada recusada → restauração em **${duracao} s**;"
            echo "health check, login e download de foto funcionando depois. Meta de RTO da Atividade 5: 30 min para falha do banco."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sumário
        if: ${{ !cancelled() }}
        run: |
          node .github/scripts/test-summary.mjs --title "Docker · E2E Playwright contra os containers" e2e-junit.xml || true
          {
            echo "### 🐳 Containers"
            echo
            echo '```'
            docker compose --profile ai ps
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs dos containers
        if: ${{ !cancelled() }}
        run: docker compose --profile ai logs --no-color > docker-compose.log

      - name: Publica logs e relatório
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: docker-e2e
          path: |
            docker-compose.log
            health.json
            e2e-report
            e2e-junit.xml
            test-results
          retention-days: 7

      - name: Derruba a stack
        if: always()
        run: docker compose --profile ai down -v
