name: Mobile

on:
  push:
    branches-ignore: [main, dev]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
  workflow_call:

# Só leitura do código; jobs que precisam de mais pedem no próprio job
permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  mobile:
    name: Mobile (typecheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Valida o app.json e os plugins nativos
        run: npx expo config --type public > /dev/null
      # Só avisa (não falha o job), mas agora o aviso aparece no sumário e como anotação, não só no log
      - name: Compatibilidade das dependências com o SDK do Expo (aviso)
        run: |
          if npx expo install --check > expo-check.txt 2>&1; then
            cat expo-check.txt
            exit 0
          fi
          cat expo-check.txt
          echo "::warning::Há dependências fora da versão esperada pelo SDK do Expo; veja o sumário da execução"
          {
            echo "### ⚠️ Mobile · Dependências fora do SDK do Expo"
            echo
            echo "Corrija com \`npx expo install --fix\` na pasta mobile."
            echo
            echo '```'
            cat expo-check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
