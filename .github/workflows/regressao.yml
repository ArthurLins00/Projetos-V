name: Regressão completa (diária)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Só leitura do código; jobs que precisam de mais pedem no próprio job
permissions:
  contents: read

concurrency:
  group: regressao-diaria
  cancel-in-progress: false

jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/backend.yml
    with:
      e2e: full
      build: true
    secrets: inherit

  ai-agent:
    name: Agente de IA
    uses: ./.github/workflows/ai-agent.yml
    with:
      live: true
    secrets: inherit

  mobile:
    name: Mobile
    uses: ./.github/workflows/mobile.yml

  maestro:
    name: E2E Mobile (Maestro)
    uses: ./.github/workflows/mobile-e2e.yml
    secrets: inherit

  # Vulnerabilidade nova aparece no dia em que é publicada, mesmo sem mudança no código
  dependencias:
    name: Dependências
    uses: ./.github/workflows/dependencias.yml
