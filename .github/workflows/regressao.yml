name: Regressão completa (diária)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Só leitura do código; jobs que precisam de mais pedem no próprio job
permissions:
  contents: read

concurrency:
  group: regressao-diaria
  cancel-in-progress: false

jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/backend.yml
    with:
      e2e: full
      build: true
    secrets:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}

  ai-agent:
    name: Agente de IA
    uses: ./.github/workflows/ai-agent.yml
    with:
      live: true
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  mobile:
    name: Mobile
    uses: ./.github/workflows/mobile.yml

  maestro:
    name: E2E Mobile (Maestro)
    uses: ./.github/workflows/mobile-e2e.yml
    secrets:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}

  # Vulnerabilidade nova aparece no dia em que é publicada, mesmo sem mudança no código
  dependencias:
    name: Dependências
    uses: ./.github/workflows/dependencias.yml

  # Imagens novas do PostgreSQL, Redis e Node podem quebrar o ambiente do Docker sem mudança no código
  docker:
    name: Docker
    uses: ./.github/workflows/docker.yml

  qualidade:
    name: Relatório de qualidade
    needs: [backend, ai-agent, mobile, maestro, dependencias]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/quality-report.yml
    permissions:
      contents: read
      actions: read
      issues: read
    with:
      publish-history: ${{ github.ref == 'refs/heads/main' }}
