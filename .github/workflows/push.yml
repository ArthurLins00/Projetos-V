name: Testes (push)

on:
  push:
    # As branches do Dependabot já passam pelo CI/CD completo no PR que ele abre
    branches-ignore: [main, dev, 'dependabot/**']

# Só leitura do código; jobs que precisam de mais pedem no próprio job
permissions:
  contents: read

concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/backend.yml
    with:
      e2e: none
      build: false
    secrets: inherit

  ai-agent:
    name: Agente de IA
    uses: ./.github/workflows/ai-agent.yml
    with:
      live: false
