name: CI/CD

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

# Só leitura do código; jobs que precisam de mais pedem no próprio job
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/backend.yml
    with:
      # PR: só o smoke (o Gate fica rápido); push em main/dev: todos os E2E do Playwright
      e2e: ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}
      build: true
    secrets: inherit

  mobile:
    name: Mobile
    uses: ./.github/workflows/mobile.yml

  ai-agent:
    name: Agente de IA
    uses: ./.github/workflows/ai-agent.yml
    with:
      live: false

  # Os fluxos do Maestro levam dezenas de minutos no emulador: rodam só na regressão diária (regressao.yml)

  dependencias:
    name: Dependências
    uses: ./.github/workflows/dependencias.yml

  # Fora do Quality Gate (ci-ok): o relatório informa, não bloqueia o merge
  qualidade:
    name: Relatório de qualidade
    needs: [backend, mobile, ai-agent, dependencias]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/quality-report.yml
    permissions:
      contents: read
      actions: read
      issues: read
    with:
      # Só o que já está em main entra na tendência; PRs leem o histórico, mas não gravam
      publish-history: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

  ci-ok:
    name: CI concluído
    runs-on: ubuntu-24.04
    needs: [backend, mobile, ai-agent, dependencias]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Visão geral
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Visão geral do CI"
            echo
            echo "| | Job | Resultado |"
            echo "|---|---|---|"
            echo "$NEEDS" | jq -r '
              {success: "✅", failure: "❌", cancelled: "🚫", skipped: "⏭️"} as $icon
              | to_entries[]
              | "| \($icon[.value.result] // "❔") | \(.key) | `\(.value.result)` |"'
            echo
            echo "Detalhes de cada suíte (falhas, cobertura e testes lentos) estão nos sumários abaixo;"
            echo "relatórios completos ficam nos artefatos da [execução]($RUN_URL)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Falha se algum job falhou ou foi cancelado
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "Resultado dos jobs: $NEEDS"
          exit 1
      - name: Todos os jobs passaram
        run: echo "CI concluído com sucesso"
