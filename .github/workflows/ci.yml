name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ── Backend: build + testes unitários, de API e E2E (um step por nível) ──
  backend:
    name: Backend (build + unit + API + E2E)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fiscalize
          POSTGRES_PASSWORD: fiscalize
          POSTGRES_DB: fiscalize_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fiscalize"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://fiscalize:fiscalize@localhost:5432/fiscalize_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret' }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD || 'Admin@123456' }}
      E2E_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Instala dependências (raiz + backend)
        run: |
          npm ci
          npm ci --prefix backend
      - name: Build (prisma generate + tsc)
        working-directory: backend
        run: npm run build
      - name: Migrações + seed
        working-directory: backend
        run: |
          npx prisma migrate deploy
          npm run seed

      # Os steps de API e E2E rodam mesmo se o nível anterior falhar, para que o
      # resultado de cada nível apareça; qualquer falha marca o job como falho.
      - name: Testes Unitários
        working-directory: backend
        run: npm run test:unit -- --ci
      - name: Testes de API
        if: ${{ !cancelled() }}
        working-directory: backend
        run: npm run test:api -- --ci
      - name: Testes End-to-End (E2E)
        if: ${{ !cancelled() }}
        run: npm run test:e2e

      - name: Relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e-report
            test-results
          retention-days: 7
      - name: Publica o build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            backend/dist
            backend/prisma
            backend/package.json
            backend/package-lock.json
          retention-days: 14

  # ── Agente de IA: typecheck + testes offline (+ ao vivo se houver GEMINI_API_KEY) ──
  ai-agent:
    name: Agente de IA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ai-agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Testes (cliente roteirizado, sem rede)
        run: npm test
      - name: Testes ao vivo contra o Gemini
        # Só em push (secrets não ficam disponíveis em PRs vindos de fork)
        if: github.event_name != 'pull_request'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_RPM: ${{ vars.GEMINI_RPM }}
        run: npm run test:live

  # ── App mobile: typecheck ──
  mobile:
    name: Mobile (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
