name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/backend.yml
    secrets: inherit

  mobile:
    name: Mobile
    uses: ./.github/workflows/mobile.yml

  ai-agent:
    name: Agente de IA
    uses: ./.github/workflows/ai-agent.yml
    secrets: inherit
