name: CI/CD

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/backend.yml
    with:
      # PR: só o smoke (o Gate fica rápido); push em main/dev: todos os E2E do Playwright
      e2e: ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}
      build: true
    secrets: inherit

  mobile:
    name: Mobile
    uses: ./.github/workflows/mobile.yml

  ai-agent:
    name: Agente de IA
    uses: ./.github/workflows/ai-agent.yml
    with:
      live: false

  maestro-smoke:
    name: E2E Mobile smoke (Maestro)
    uses: ./.github/workflows/mobile-e2e.yml
    with:
      flows: mobile/e2e/login_invalid_password.yaml mobile/e2e/session_persistence.yaml
    secrets: inherit

  ci-ok:
    name: CI concluído
    runs-on: ubuntu-24.04
    needs: [backend, mobile, ai-agent, maestro-smoke]
    if: always()
    steps:
      - name: Falha se algum job falhou ou foi cancelado
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "Resultado dos jobs: $NEEDS"
          exit 1
      - name: Todos os jobs passaram
        run: echo "CI concluído com sucesso"
