name: Backend

# Testes do backend (unitários, API e E2E) a cada mudança no backend ou nos E2E.
# Em main/dev (push e PR) quem roda o módulo é o ci.yml, junto com o resto do projeto.
on:
  push:
    branches-ignore: [main, dev]
    paths:
      - 'backend/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend.yml'
      - '.github/workflows/regressao.yml'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ── Testes: reutiliza o job de regressão completa (um step por nível) ──
  testes:
    name: Testes
    uses: ./.github/workflows/regressao.yml
    secrets: inherit

  # ── Build: typecheck (tsc) e publicação do build da main ──
  build:
    name: Build (prisma generate + tsc)
    runs-on: ubuntu-latest
    needs: testes
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Build (prisma generate + tsc)
        run: npm run build
      - name: Publica o build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            backend/dist
            backend/prisma
            backend/package.json
            backend/package-lock.json
          retention-days: 14
