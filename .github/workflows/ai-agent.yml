name: Agente de IA

on:
  workflow_call:
    inputs:
      live:
        description: 'Roda também os testes ao vivo contra o Gemini'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      live:
        description: 'Roda também os testes ao vivo contra o Gemini'
        type: boolean
        default: true

concurrency:
  group: ai-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  ai-agent:
    name: Agente de IA
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ai-agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ai-agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Testes (cliente roteirizado, sem rede)
        run: npm run test:ci
      - name: Sumário dos testes
        if: ${{ !cancelled() }}
        run: node ../.github/scripts/test-summary.mjs --title "Agente de IA · Testes (sem rede)" reports/junit.xml
      - name: Relatório dos testes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: ai-agent-test-reports
          path: ai-agent/reports
          if-no-files-found: ignore
          retention-days: 7
      - name: Testes ao vivo contra o Gemini
        if: inputs.live
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_RPM: ${{ vars.GEMINI_RPM }}
        run: npm run test:live
