name: Segurança diária

# Todo dia às 07h (Brasília) roda a varredura de segurança (seguranca.yml: npm audit, gitleaks, Semgrep e os controles
# do projeto) e mantém UMA issue com as pendências, atribuída a victorsimasdev:
#   - cria a issue quando aparece o primeiro item, com o que fazer em cada um;
#   - nos dias seguintes atualiza o corpo e só comenta quando algum item aparece ou é resolvido;
#   - fecha a issue quando não sobra nada.
# Também pode ser disparado pela aba Actions → Segurança diária → Run workflow.
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguranca-diaria
  cancel-in-progress: false

jobs:
  varredura:
    name: Segurança
    uses: ./.github/workflows/seguranca.yml

  issue:
    name: Issue de pendências
    needs: varredura
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Baixa o relatório de segurança desta execução
        uses: actions/download-artifact@v8
        with:
          name: relatorio-seguranca
          path: artifact

      - name: Cria, atualiza ou fecha a issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/security/sync-issue.mjs --report artifact/security-report --assignee victorsimasdev
