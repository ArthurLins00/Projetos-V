# Atualizações automáticas de dependências: todo dia às 07h (Recife), o Dependabot compara o package-lock.json de
# cada pasta com as versões publicadas e abre PR quando há versão mais nova. Para não abrir um PR por pacote,
# as atualizações são agrupadas por pasta: um PR com as minor e patch e outro com as major (que costumam exigir
# mudança de código). Todo PR é atribuído a victorsimasdev e passa pelo CI e pelo Quality Gate como qualquer outro.
# Vulnerabilidades são tratadas à parte pelo workflow Segurança diária (seguranca-diaria.yml), que abre uma issue.
# Política: docs/seguranca-da-informacao/06_Gestao_de_Fornecedores.md
version: 2

updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: daily, time: '07:00', timezone: America/Recife }
    open-pull-requests-limit: 5
    assignees: [victorsimasdev]
    commit-message: { prefix: chore, include: scope }
    ignore:
      # Os tipos do Node acompanham a versão que roda o projeto (Node 22, a mesma do CI e do Docker)
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
      backend-major:
        update-types: [major]

  - package-ecosystem: npm
    directory: /ai-agent
    schedule: { interval: daily, time: '07:00', timezone: America/Recife }
    open-pull-requests-limit: 5
    assignees: [victorsimasdev]
    commit-message: { prefix: chore, include: scope }
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      ai-agent-minor-patch:
        update-types: [minor, patch]
      ai-agent-major:
        update-types: [major]

  # Testes E2E (Playwright) no package.json da raiz
  - package-ecosystem: npm
    directory: /
    schedule: { interval: daily, time: '07:00', timezone: America/Recife }
    open-pull-requests-limit: 3
    assignees: [victorsimasdev]
    commit-message: { prefix: chore, include: scope }
    groups:
      e2e:
        patterns: ['*']

  # App: as versões do Expo, do React e do React Native precisam ficar alinhadas ao SDK. Trocar de SDK é uma
  # migração feita à mão (npx expo install --fix); aqui entram só as correções (patch) desses pacotes.
  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: daily, time: '07:00', timezone: America/Recife }
    open-pull-requests-limit: 5
    assignees: [victorsimasdev]
    commit-message: { prefix: chore, include: scope }
    ignore:
      - dependency-name: 'expo'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: 'expo-*'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@expo/*'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: 'react'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: 'react-dom'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: 'react-native'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: 'react-native-*'
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      mobile-minor-patch:
        update-types: [minor, patch]
      mobile-major:
        update-types: [major]

  # Versões das actions usadas nos workflows
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: daily, time: '07:00', timezone: America/Recife }
    assignees: [victorsimasdev]
    commit-message: { prefix: 'ci' }
    groups:
      actions:
        patterns: ['*']

# Os Dockerfiles usam a tag node:22-bookworm-slim, que já recebe as correções do Node 22 a cada build; trocar a
# versão major acompanha a do CI (NODE_VERSION nos workflows) e é feita à mão.
