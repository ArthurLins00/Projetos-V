# Roda no app instalado pelo Android Studio / `npx expo run:android` (dev build)
appId: com.projetosv.fiscalize

---

- launchApp:
    clearState: true

# 1. FLUXO DE LOGIN (Aproveitando a base do seu colega)
- tapOn: "E-mail"
- inputText: "cidadao@fiscalize.gov.br"
- tapOn: "Senha"
- inputText: "Cidadao@123456"
- tapOn: "Entrar"


- extendedWaitUntil:
    visible: "Minhas Demandas" 
    timeout: 10000


- tapOn: "+" 
- assertVisible: "Nova Demanda"


- tapOn: "Ex: Poste apagado"
- inputText: "Buraco na via"

- tapOn: "Infraestrutura"

- tapOn: "Ex: Rua das Flores, 123"
- inputText: "Avenida Central, 500"

- tapOn: "Detalhe o problema..."
- inputText: "Asfalto cedeu causando risco grave de acidentes."


- hideKeyboard 

# 4. INTERAÇÃO COM O GPS E SUBMISSÃO
- tapOn: "📍 Pegar GPS"
- extendedWaitUntil:
    visible: "📍 GPS OK"
    timeout: 5000

- tapOn: "Registrar Demanda"

# 5. VALIDAÇÃO FINAL DO E2E

- assertVisible: "Sucesso" 
- tapOn: "OK" 
- assertVisible: "Minhas Demandas"