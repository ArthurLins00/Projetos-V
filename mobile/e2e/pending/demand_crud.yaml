appId: com.projetosv.fiscalize
---
- evalScript: ${output.titulo = 'Maestro poste ' + Date.now()}

- runFlow: ../subflows/login.yaml

- tapOn:
    id: "new-demand-button"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "form-title"
    timeout: 15000
- assertVisible: "Nova Demanda"

- tapOn:
    id: "form-title"
- inputText: ${output.titulo}
- tapOn: "Iluminação Pública"
- tapOn:
    id: "form-address"
- inputText: "Rua das Flores, 123"
- tapOn:
    id: "form-description"
- inputText: "Poste apagado ha uma semana"
- hideKeyboard

- scrollUntilVisible:
    element:
      id: "form-state"
- tapOn:
    id: "form-state"
- tapOn:
    id: "form-state-search"
- inputText: "Pernambuco"
- tapOn:
    id: "form-state-option-PE"
# A lista de cidades vem do IBGE; se a requisição falhar o form mostra um campo de texto
- scrollUntilVisible:
    element:
      id: "form-city(-text)?"
    centerElement: true
- runFlow:
    when:
      visible:
        id: "form-city-text"
    commands:
      - tapOn:
          id: "form-city-text"
      - inputText: "Recife"
      - hideKeyboard
- runFlow:
    when:
      visible:
        id: "form-city"
    commands:
      - tapOn:
          id: "form-city"
      - extendedWaitUntil:
          visible:
            id: "form-city-search"
          timeout: 10000
      - tapOn:
          id: "form-city-search"
      - inputText: "Recife"
      - extendedWaitUntil:
          visible:
            id: "form-city-option-Recife"
          timeout: 15000
      - tapOn:
          id: "form-city-option-Recife"
- scrollUntilVisible:
    element:
      id: "form-zone-Urbana"
- tapOn:
    id: "form-zone-Urbana"

- setLocation:
    latitude: -8.0476
    longitude: -34.877
- scrollUntilVisible:
    element:
      id: "form-gps"
- tapOn:
    id: "form-gps"
- extendedWaitUntil:
    visible: "GPS OK"
    timeout: 15000

- scrollUntilVisible:
    element:
      id: "form-photo"
- tapOn:
    id: "form-photo"
- extendedWaitUntil:
    visible:
      id: "camera-shutter"
    timeout: 10000
- tapOn:
    id: "camera-shutter"
- extendedWaitUntil:
    visible:
      id: "form-photo-thumb-0"
    timeout: 15000

- scrollUntilVisible:
    element:
      id: "form-submit"
- tapOn:
    id: "form-submit"
- extendedWaitUntil:
    visible: "Demanda registrada com sucesso!"
    timeout: 20000
- tapOn: "OK"

- extendedWaitUntil:
    visible: "Minhas Demandas"
    timeout: 10000
- tapOn:
    id: "demand-search"
- inputText: ${output.titulo}
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "demand-card"
      containsChild:
        text: ${output.titulo}
    timeout: 10000

- tapOn:
    id: "demand-card"
    containsChild:
      text: ${output.titulo}
- extendedWaitUntil:
    visible: "Detalhes da Demanda"
    timeout: 10000
- assertVisible: "Iluminação Pública"
- assertVisible: "Aberto"

- tapOn:
    id: "detail-edit"
- extendedWaitUntil:
    visible:
      id: "form-title"
    timeout: 15000
- assertVisible: "Editar Demanda"
- tapOn:
    id: "form-title"
- eraseText: 80
- inputText: "${output.titulo} editado"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "form-submit"
- tapOn:
    id: "form-submit"
- extendedWaitUntil:
    visible: "Demanda atualizada com sucesso!"
    timeout: 20000
- tapOn: "OK"
- extendedWaitUntil:
    visible: "${output.titulo} editado"
    timeout: 10000

- scrollUntilVisible:
    element:
      id: "detail-delete"
- tapOn:
    id: "detail-delete"
- assertVisible: "Tem certeza que deseja remover esta demanda?"
- tapOn: "(?i)remover"
- extendedWaitUntil:
    visible: "Demanda removida."
    timeout: 10000
- tapOn: "OK"

- extendedWaitUntil:
    visible: "Nenhuma demanda encontrada."
    timeout: 10000
- assertNotVisible:
    id: "demand-card"
