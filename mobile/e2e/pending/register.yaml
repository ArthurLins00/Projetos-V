appId: com.projetosv.fiscalize
name: "[TC-63] M-02 Cadastro pela tela e login com a conta nova"
---
- evalScript: ${output.email = 'maestro.' + Date.now() + '@teste.fiscalize'}

- launchApp:
    clearState: true
# 60 s: no primeiro fluxo do CI o app ainda carrega o JavaScript do Metro; a espera termina assim que o login aparece
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "login-go-register"
    centerElement: true
- tapOn:
    id: "login-go-register"

- tapOn:
    id: "register-name"
- inputText: "Maestro Teste"
- tapOn:
    id: "register-email"
- inputText: ${output.email}
- tapOn:
    id: "register-password"
- inputText: "SenhaMaestro@123"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "register-submit"
- tapOn:
    id: "register-submit"

- extendedWaitUntil:
    visible: "Conta criada! Você já pode fazer login."
    timeout: 10000
- tapOn: "OK"

# Login direto na tela: o env do cabeçalho do subflows/login.yaml prevalece sobre o passado pelo runFlow,
# e o fluxo entrava com o cidadão do seed em vez da conta recém-criada
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 10000
- tapOn:
    id: "login-email"
- eraseText: 60
- inputText: ${output.email}
- tapOn:
    id: "login-password"
- inputText: "SenhaMaestro@123"
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "terms-accept"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: "terms-accept"
    commands:
      - tapOn:
          id: "terms-accept"
- extendedWaitUntil:
    visible: "Minhas Demandas"
    timeout: 15000
# A saudação tem numberOfLines={1} e pode aparecer truncada no header
- assertVisible: "Olá, Maestro.*"
- assertVisible: "Nenhuma demanda registrada ainda."
