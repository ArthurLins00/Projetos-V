appId: com.projetosv.fiscalize
env:
  EMAIL: cidadao@fiscalize.gov.br
  PASSWORD: Cidadao@123456
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 20000
- tapOn:
    id: "login-email"
- inputText: ${EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "terms-accept"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: "terms-accept"
    commands:
      - tapOn:
          id: "terms-accept"
- extendedWaitUntil:
    visible: "Minhas Demandas"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "demand-list"
    timeout: 15000
