appId: com.projetosv.fiscalize
---
- runFlow: subflows/login.yaml

- tapOn:
    id: "profile-button"
- scrollUntilVisible:
    element:
      id: "profile-logout"
- tapOn:
    id: "profile-logout"
- assertVisible: "Deseja encerrar a sessão?"
- tapOn: "(?i)sair"
- extendedWaitUntil:
    visible:
      id: "login-submit"
    timeout: 10000

- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "login-submit"
    timeout: 20000
- assertNotVisible: "Minhas Demandas"
