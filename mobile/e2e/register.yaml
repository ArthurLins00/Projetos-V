appId: com.projetosv.fiscalize
---
- evalScript: ${output.email = 'maestro.' + Date.now() + '@teste.fiscalize'}

- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "login-go-register"
    timeout: 20000
- tapOn:
    id: "login-go-register"

- tapOn:
    id: "register-name"
- inputText: "Maestro Teste"
- tapOn:
    id: "register-email"
- inputText: ${output.email}
- tapOn:
    id: "register-password"
- inputText: "SenhaMaestro@123"
- hideKeyboard
- tapOn:
    id: "register-submit"

- extendedWaitUntil:
    visible: "Conta criada! Você já pode fazer login."
    timeout: 10000
- tapOn: "OK"

- runFlow:
    file: subflows/login.yaml
    env:
      EMAIL: ${output.email}
      PASSWORD: "SenhaMaestro@123"
- assertVisible: "Olá, Maestro Teste"
- assertVisible: "Nenhuma demanda registrada ainda."
