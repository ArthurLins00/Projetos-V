appId: com.projetosv.fiscalize
name: "[TC-63] M-01 Login com senha errada mostra o alerta e fica na tela de login"
---
- launchApp:
    clearState: true
# 60 s: no primeiro fluxo do CI o app ainda carrega o JavaScript do Metro; a espera termina assim que o login aparece
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 60000

- tapOn:
    id: "login-email"
- inputText: "cidadao@fiscalize.gov.br"
- tapOn:
    id: "login-password"
- inputText: "senha-incorreta"
- hideKeyboard
- tapOn:
    id: "login-submit"

- extendedWaitUntil:
    visible: "Falha no Login"
    timeout: 10000
- assertVisible: "Credenciais inválidas."
- tapOn: "OK"

- assertVisible:
    id: "login-submit"
- assertNotVisible: "Minhas Demandas"
