appId: host.exp.exponent
---
# Limpa o estado do Expo Go
- clearState

# Abre o Fiscalize no Expo Go
- openLink: "exp://192.168.15.96:8081"

# Primeira tela informativa do Developer Menu
- extendedWaitUntil:
    visible: "Continue"
    timeout: 15000

- tapOn: "Continue"

# Fecha o Developer Menu
- back

# Aguarda a tela de login
- extendedWaitUntil:
    visible: "E-mail"
    timeout: 15000

# Preenche usuário existente
- tapOn: "E-mail"
- inputText: "cidadao@fiscalize.gov.br"

# Preenche senha incorreta
- tapOn: "Senha"
- inputText: "senha-incorreta"

# Tenta entrar
- tapOn: "Entrar"

# Aguarda mensagem de erro
- extendedWaitUntil:
    visible: "Falha no Login"
    timeout: 10000

# Confirma mensagem
- assertVisible: "E-mail ou senha incorretos."
